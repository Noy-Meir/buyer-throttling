name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only access to the repository. Nothing here publishes anything.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Caches the module download and build cache, keyed on go.sum.
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Lint
        run: make lint

      # Tests use miniredis, an in-process Redis, so no Redis service is needed.
      - name: Test (race detector)
        run: make test

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      # Builds the four images without starting any containers.
      - name: Build images
        run: docker compose build
